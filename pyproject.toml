[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["backend/apps/identity/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"backend/config/settings/development.py" = ["F403", "F405"]
"backend/config/settings/production.py" = ["F403", "F405"]
