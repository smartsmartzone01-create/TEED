{% extends "base.html" %}
{% block content %}
<h2>Saved Items</h2>

{% if items %}
  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
    {% for item in items %}
      <div class="border rounded p-2">
        <a href="{% url 'store:product_detail' item.product.slug %}">
          <img src="{{ item.product.main_image.url }}" alt="{{ item.product.name }}" class="w-full h-32 object-contain" />
          <p class="font-semibold mt-2">{{ item.product.name }}</p>
          <p class="text-sm text-gray-600">TZS {{ item.product.discount_price|default:item.product.price|floatformat:0 }}</p>
        </a>
      </div>
    {% endfor %}
  </div>
{% else %}
  <p>You have no saved items.</p>
{% endif %}
{% endblock %}
